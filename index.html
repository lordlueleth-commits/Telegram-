<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>School registration</title>
  <style>
  fieldset{
    background-color: rbga( 0, 0, 0,0.29)
  }
  
  </style>
</head>
</body>
<form action="/search" method="POST">
  <fieldset>
  <label for="email">Email adress</label>
  <input type="email" id="email" required>
  </fieldset>
  <fieldset>
  <label for="usarname">Type your usarname</label>
  <input type="usarname" id="usarname" name="username" required minlength="5" maxlength="15">
  </fieldset>
  <fieldset>
    <label for="psw">Password</label>
  <input type="password" id="psw" name="psw" required>
  </fieldset>
  <fieldset>
    <legend>Select your gender</legend>
    <label for="male">Male</label>
    <input type="radio" id="male" name="sex">
    <label for="fml">Female</label>
    <input type="radio" id="fml" name="sex">
  </fieldset>
  <fieldset>
    <button action="submit">Submit</button>
  </fieldset>
  </form>
</html>
